name: Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Flatpak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install flatpak-builder
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder

      - name: Compile and Package Flatpak
        run: |
          ./distribution/flatpak/build-flatpak.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fantastech-linux
          path: |
            dist/*.flatpak

  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer
        run: |
          cargo build --release --manifest-path core/Cargo.toml --bin fantastech
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" distribution/windows/installer.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fantastech-windows
          path: dist/*.exe

  publish-release:
    name: Publish Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
