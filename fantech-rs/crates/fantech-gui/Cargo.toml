[package]
name = "fantech-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native graphical interface for Fantech MK894 Maxpower II"

[[bin]]
name = "fantech-gui"
path = "src/main.rs"

[dependencies]
fantech-protocol = { path = "../fantech-protocol" }
fantech-transport = { path = "../fantech-transport" }
fantech-device = { path = "../fantech-device" }
fantech-core = { path = "../fantech-core" }
fantech-emulator = { path = "../fantech-emulator" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
tracing.workspace = true
tracing-subscriber.workspace = true
