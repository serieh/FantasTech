[workspace]
members = [
    "crates/fantech-protocol",
    "crates/fantech-transport",
    "crates/fantech-device",
    "crates/fantech-emulator",
    "crates/fantech-core",
    "crates/fantech-cli",
    "crates/fantech-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Clean-Room Engineering Team"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/clean-room/fantech-rs"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "cargo"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
